apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-tourism-blue
  namespace: blue
  labels:
    app: medical-tourism-blue
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-tourism-blue
  template:
    metadata:
      labels:
        app: medical-tourism-blue
        color: blue
    spec:
      containers:
      - name: medical-tourism-web
        image: us-central1-docker.pkg.dev/${PROJECT_ID}/medical-tourisum/${IMAGE}:${GITHUB_SHA}
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3