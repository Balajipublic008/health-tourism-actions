apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-tourism-blue
  labels:
    app: medical-tourism-blue
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-tourism-blue
  template:
    metadata:
      labels:
        app: medical-tourism-blue
        color: blue
    spec:
      containers:
      - name: medical-tourism-web
        image: medical-tourism-app:latest  # Will be replaced by sed
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5