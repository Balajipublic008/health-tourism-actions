apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-tourism-blue
  labels:
    app: medical-tourism-blue
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-tourism-blue
  template:
    metadata:
      labels:
        app: medical-tourism-blue
        color: blue
    spec:
      containers:
      - name: medical-tourism-web
        image: medical-tourism-app:latest  # Use the same placeholder as the sed command searches for
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:  # Add readiness probe
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5